name: Build trending tickers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'  # 7am ET daily

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - uses: actions/upload-artifact@v4
        with:
          name: wsb-catalysts-ics
          path: wsb_catalysts.ics
      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wsb_catalysts.ics
          git diff --staged --quiet || git commit -m "Update calendar [skip ci]"
          git push
