<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WSB.CATALYSTS">
<meta name="theme-color" content="#050a05">
<title>WSB.CATALYSTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #050a05;
    --surface: #0a1410;
    --border: #1c3a26;
    --border-bright: #2c5a3a;
    --text: #4eff8a;
    --text-bright: #a6ffc0;
    --text-dim: #2f8a55;
    --text-faint: #1a4530;
    --amber: #ffb84a;
    --red: #ff5566;
    --green: #4eff8a;
    --display: 'VT323', 'Courier New', monospace;
    --mono: 'Share Tech Mono', 'VT323', 'Courier New', monospace;
    --glow: 0 0 1px currentColor, 0 0 6px rgba(78, 255, 138, 0.35);
    --glow-strong: 0 0 1px currentColor, 0 0 10px rgba(78, 255, 138, 0.55);
  }

  html, body { background: var(--bg); }

  body {
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.3;
    text-shadow: var(--glow);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1000;
    background: repeating-linear-gradient(
      0deg, rgba(0,0,0,0.18) 0, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px);
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 999;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  @media (prefers-reduced-motion: reduce) {
    body::before, body::after { display: none; }
    body { text-shadow: none; }
  }

  /* ===== HEADER ===== */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px 6px;
  }
  h1 {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 400;
    color: var(--text-bright);
    letter-spacing: 0.04em;
    text-shadow: var(--glow-strong);
  }
  h1 .blink {
    display: inline-block;
    animation: blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .meta {
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 1px;
    letter-spacing: 0.04em;
  }
  .meta .label { color: var(--text-faint); }

  /* ===== COLUMN HEADER ===== */
  .col-headers {
    display: grid;
    grid-template-columns: 22px 12px 56px 1fr 56px;
    gap: 6px;
    padding: 6px 10px 4px;
    color: var(--text-faint);
    font-size: 10px;
    letter-spacing: 0.06em;
    border-bottom: 1px dashed var(--border);
    align-items: baseline;
  }
  .col-headers .ch-mid {
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }
  .col-headers .ch-mid span { flex: 1; text-align: center; }
  .col-headers .ch-mid .ch-mom { text-align: left; flex: 0 0 32px; }
  .col-headers .ch-mid .ch-exp { flex: 0 0 38px; }
  .col-headers .ch-mid .ch-str { flex: 0 0 42px; }
  .col-headers .ch-mid .ch-imh { flex: 0 0 56px; text-align: right; }
  .col-headers .ch-spot { text-align: right; }

  /* ===== ROW ===== */
  .row {
    display: grid;
    grid-template-columns: 22px 12px 56px 1fr 56px;
    gap: 6px;
    align-items: center;
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
  }
  .row.signal-buy_premium { background: rgba(78, 255, 138, 0.04); }
  .row.signal-sell_premium { background: rgba(255, 85, 102, 0.05); }

  .rank {
    color: var(--text-faint);
    font-size: 11px;
    text-align: right;
  }

  .dot-cell {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
  }
  .dot.signal-buy_premium {
    background: var(--green);
    box-shadow: 0 0 6px var(--green), 0 0 10px rgba(78,255,138,0.5);
  }
  .dot.signal-sell_premium {
    background: var(--red);
    box-shadow: 0 0 6px var(--red), 0 0 10px rgba(255,85,102,0.5);
  }
  .dot.signal-neutral { background: var(--text-dim); }

  .ticker {
    font-family: var(--display);
    font-size: 16px;
    color: var(--text-bright);
    text-shadow: var(--glow-strong);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .mid {
    display: flex;
    gap: 8px;
    align-items: baseline;
    overflow: hidden;
    font-size: 11px;
  }
  .mid .mom { flex: 0 0 32px; }
  .mid .exp { flex: 0 0 38px; color: var(--text-dim); }
  .mid .str { flex: 0 0 42px; color: var(--text); }
  .mid .imh { flex: 0 0 56px; text-align: right; color: var(--text); }
  .mid .imh.dim { color: var(--text-faint); }
  .mid .exp.imminent { color: var(--amber); text-shadow: 0 0 4px rgba(255,184,74,0.4); }
  .mid .exp.faint { color: var(--text-faint); }
  .mid .str.faint { color: var(--text-faint); }

  .mom-up { color: var(--text-bright); }
  .mom-down { color: var(--red); text-shadow: 0 0 4px rgba(255,85,102,0.4); }
  .mom-new { color: var(--amber); text-shadow: 0 0 4px rgba(255,184,74,0.4); }
  .mom-flat { color: var(--text-faint); }

  .spot {
    font-family: var(--display);
    font-size: 16px;
    color: var(--text-bright);
    text-shadow: var(--glow-strong);
    text-align: right;
    line-height: 1;
  }
  .spot.faint { color: var(--text-faint); text-shadow: none; font-size: 12px; }

  /* ===== STATES & FOOTER ===== */
  .state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-family: var(--display);
    font-size: 22px;
    letter-spacing: 0.08em;
  }
  .state.error { color: var(--red); }
  .state .blink { display: inline-block; animation: blink 1.1s steps(2) infinite; }

  .disclaimer {
    margin: 16px 10px 12px;
    padding: 8px 10px;
    border: 1px dashed var(--border);
    color: var(--text-faint);
    font-size: 10px;
    line-height: 1.55;
  }
  .disclaimer::before {
    content: '/* SYS_NOTE */';
    color: var(--text-dim);
    display: block;
    margin-bottom: 3px;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>WSB.CATALYSTS<span class="blink">_</span></h1>
  <div class="meta"><span class="label">LAST_SYNC </span><span id="updated">—</span></div>
</div>

<div class="col-headers">
  <span style="text-align:right">##</span>
  <span style="text-align:center">·</span>
  <span>TKR</span>
  <span class="ch-mid">
    <span class="ch-mom">MOM</span>
    <span class="ch-exp">EXP</span>
    <span class="ch-str">STR</span>
    <span class="ch-imh">IM/HIST</span>
  </span>
  <span class="ch-spot">SPOT</span>
</div>

<main id="content">
  <div class="state">SYNCING<span class="blink">▒</span></div>
</main>

<script>
const $content = document.getElementById('content');
const $updated = document.getElementById('updated');

let state = { data: null };

async function load() {
  try {
    const r = await fetch('./data.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    state.data = await r.json();
    render();
  } catch (e) {
    $content.innerHTML = `<div class="state error">FETCH FAILED: ${e.message}</div>`;
  }
}

function render() {
  if (!state.data) return;
  const dt = new Date(state.data.generated_at);
  const Y = dt.getFullYear();
  const M = String(dt.getMonth() + 1).padStart(2, '0');
  const D = String(dt.getDate()).padStart(2, '0');
  const h = String(dt.getHours()).padStart(2, '0');
  const m = String(dt.getMinutes()).padStart(2, '0');
  $updated.textContent = `${Y}-${M}-${D} ${h}:${m}`;
  renderRows();
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function momentumDisplay(label) {
  if (label.startsWith('up')) return { text: '▲' + label.slice(3).trim(), cls: 'mom-up' };
  if (label.startsWith('down')) return { text: '▼' + label.slice(5).trim(), cls: 'mom-down' };
  if (label === 'NEW') return { text: '★ NEW', cls: 'mom-new' };
  return { text: '─', cls: 'mom-flat' };
}

function shortDate(iso) {
  // 2026-08-04 -> 8/04
  const d = new Date(iso + 'T00:00:00');
  return `${d.getMonth() + 1}/${String(d.getDate()).padStart(2, '0')}`;
}

function avgAbsMove(moves) {
  if (!moves || !moves.length) return null;
  return moves.reduce((s, m) => s + Math.abs(m.move_pct), 0) / moves.length;
}

function getSignal(t) {
  return t.play && t.play.verdict ? t.play.verdict.signal : null;
}

function renderRow(t) {
  const signal = getSignal(t);
  const dotClass = signal ? `signal-${signal}` : '';
  const rowClass = signal ? `signal-${signal}` : '';

  const mom = momentumDisplay(t.momentum_label);

  // Expiration column: post-earnings exp date if available, else earnings date itself, else —
  let expText = '—', expClass = 'faint';
  const p = t.play;
  if (p && p.post_earnings_exp) {
    expText = shortDate(p.post_earnings_exp);
    if (t.days_to_earnings !== null && t.days_to_earnings <= 14) expClass = 'imminent';
    else expClass = '';
  } else if (t.next_earnings) {
    expText = shortDate(t.next_earnings);
    expClass = t.days_to_earnings <= 14 ? 'imminent' : '';
  }

  // Straddle price column
  let strText = '—', strClass = 'faint';
  if (p && p.straddle_price) {
    strText = '$' + p.straddle_price.toFixed(2);
    strClass = '';
  }

  // IM/HIST column
  let imhText = '—', imhClass = 'dim';
  if (p && p.implied_move_pct) {
    const avg = avgAbsMove(p.historical_moves);
    if (avg !== null) {
      imhText = `${p.implied_move_pct.toFixed(1)}/${avg.toFixed(1)}`;
      imhClass = '';
    } else {
      imhText = `${p.implied_move_pct.toFixed(1)}/—`;
      imhClass = '';
    }
  }

  // Spot price column
  let spotText = '—', spotClass = 'faint';
  if (t.spot) {
    spotText = '$' + t.spot.toFixed(2);
    spotClass = '';
  }

  return `
    <div class="row ${rowClass}">
      <span class="rank">${String(t.rank).padStart(2, '0')}</span>
      <span class="dot-cell"><span class="dot ${dotClass}"></span></span>
      <span class="ticker">$${escapeHTML(t.ticker)}</span>
      <span class="mid">
        <span class="mom ${mom.cls}">${mom.text}</span>
        <span class="exp ${expClass}">${expText}</span>
        <span class="str ${strClass}">${strText}</span>
        <span class="imh ${imhClass}">${imhText}</span>
      </span>
      <span class="spot ${spotClass}">${spotText}</span>
    </div>
  `;
}

function renderRows() {
  const rows = state.data.tickers.map(renderRow).join('');
  const disclaimer = `
    <div class="disclaimer">
      cols: ## rank // ● verdict (green=cheap/red=expensive) // tkr // mom (24h rank Δ) // exp (1st post-earn expiry) // str (atm straddle $) // im/hist (implied vs avg of last 4 reactions) // spot.<br>
      eod data, n=4. screening only — not financial advice.
    </div>
  `;
  $content.innerHTML = rows + disclaimer;
}

load();
</script>

</body>
</html>
